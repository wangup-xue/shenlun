<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>江苏申论规范表达词库</title><meta name="description" content="江苏省考申论通用概念、写作表达与适用场景积累">
<link rel="stylesheet" href="assets/style.css">
<style>
.jst-wrap{max-width:1100px;margin:24px auto;padding:0 18px}.jst-note{color:#777;font-size:13px;line-height:1.8}.jst-tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.jst-tools input,.jst-tools select{padding:10px;border:1px solid #ddd;border-radius:8px;min-width:180px}.jst-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}.jst-card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:16px}.jst-card h3{margin:0 0 8px}.jst-theme{font-size:12px;color:#65758b}.jst-card p{font-size:14px;line-height:1.7;margin:8px 0}.jst-foot{font-size:12px;color:#888;margin-top:10px}
</style></head><body>
<header class="topbar"><div class="topbar-inner"><div class="brand"><h1>江苏申论素材站</h1><span class="sub">通用规范表达 · 写作积累</span></div><nav class="tabs"><a class="tab" href="index.html">江苏版首页</a><a class="tab" href="jiangsu-cases.html">案例与新闻</a><a class="tab active" href="jiangsu-terms.html">规范表达词库</a><a class="tab" href="hunan-archive.html">湖南历史归档</a></nav></div></header>
<main class="jst-wrap"><h1>江苏申论规范表达词库</h1><p class="jst-note" id="notice">加载中…</p>
<div class="jst-tools"><input id="q" type="search" placeholder="搜索词条、释义、适用场景"><select id="theme"><option value="">全部主题</option></select><span id="count" class="jst-note"></span></div>
<div id="terms" class="jst-grid"></div></main>
<script>
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function start(){try{const r=await fetch('data/jiangsu/terms.json?t='+Date.now());if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();const rows=d.terms||[];document.getElementById('notice').textContent=d.note||'学习参考词库';const themes=[...new Set(rows.map(x=>x.theme))];document.getElementById('theme').innerHTML='<option value="">全部主题</option>'+themes.map(x=>'<option>'+esc(x)+'</option>').join('');const render=()=>{const q=document.getElementById('q').value.trim().toLowerCase(),t=document.getElementById('theme').value;const list=rows.filter(x=>(!t||x.theme===t)&&(!q||[x.term,x.definition,x.usage,x.theme,(x.related_cities||[]).join(' ')].join(' ').toLowerCase().includes(q)));document.getElementById('count').textContent='显示 '+list.length+' / '+rows.length+' 条';document.getElementById('terms').innerHTML=list.map(x=>'<article class="jst-card"><div class="jst-theme">'+esc(x.theme)+' · '+esc(x.source_type)+'</div><h3>'+esc(x.term)+'</h3><p><b>理解：</b>'+esc(x.definition)+'</p><p><b>写作适用：</b>'+esc(x.usage)+'</p><p><b>关联城市：</b>'+esc((x.related_cities||[]).join('、'))+'</p><div class="jst-foot">'+esc(x.verification_note)+'</div></article>').join('')||'<p>没有匹配词条。</p>'};document.getElementById('q').addEventListener('input',render);document.getElementById('theme').addEventListener('change',render);render()}catch(e){document.getElementById('terms').textContent='词库加载失败：'+e.message}}
document.addEventListener('DOMContentLoaded',start);
</script></body></html>
