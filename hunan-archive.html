<header class="topbar">

<div style="max-width:1100px;margin:12px auto;padding:12px 18px;background:#fff7e6;border:1px solid #f0dfb5;border-radius:10px;color:#765b22">这是原湖南版历史素材归档，保留原有文章、规范词库和索引。内容带有湖南地域语境，江苏备考请优先使用江苏版案例与新闻页面。<a href="index.html">返回江苏版首页</a></div>
