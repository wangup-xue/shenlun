name: Daily Jiangsu News Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "15 23 * * *"

permissions:
  contents: write

concurrency:
  group: daily-jiangsu
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: jiangsu-migration
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover news
        run: python scripts/jiangsu_news.py
      - name: Build Jiangsu analysis cards
        env:
          MINIMAX_CN_API_KEY: ${{ secrets.MINIMAX_CN_API_KEY }}
        run: python scripts/jiangsu_pipeline.py
      - name: Commit updated metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jiangsu/news.json data/jiangsu/leads.json
          if git diff --cached --quiet; then
            echo "No news metadata changes."
          else
            git commit -m "chore: update Jiangsu news and analysis cards"
            git push origin HEAD:jiangsu-migration
          fi
