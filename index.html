<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>江苏申论素材站 · 三色笔记</title>
<meta name="description" content="江苏省考申论素材站：人民日报新闻线索、江苏13市特色案例与三色笔记">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <h1>江苏申论素材站</h1>
      <span class="sub">江苏省考 · 三色笔记 · 每日更新</span>
    </div>
    <nav class="tabs">
      <button class="tab active" data-tab="material">今日素材</button>
      <button class="tab" data-tab="terms">规范词库</button>
      <button class="tab" data-tab="outline">考点提纲</button>
      <button class="tab" data-tab="all">全部索引</button>
      <a class="tab" href="jiangsu-cases.html">江苏13市案例与新闻</a>
    </nav>
  </div>
</header>

<div class="toolbar">
  <input type="search" id="q" placeholder="搜索标题 / 正文 / 规范词…">
  <label>来源</label>
  <select id="f-source"><option value="">全部</option></select>
  <label>栏目</label>
  <select id="f-column"><option value="">全部</option></select>
  <label>日期</label>
  <select id="f-date"><option value="">全部</option></select>
  <div class="chips" id="chips"></div>
  <span class="count" id="count"></span>
</div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <h2>📌 考点提纲</h2>
    <div id="side-list"><div class="empty">加载中…</div></div>
  </aside>

  <main class="main">
    <section class="panel on" id="panel-material">
      <div id="articles"><div class="loading">正在加载素材…</div></div>
    </section>

    <section class="panel" id="panel-terms">
      <div class="legend">
        <span>规范词库 · 共 <b id="term-count">0</b> 条</span>
        <span>历史词条保留原始语境，江苏适用性请核验</span>
      </div>
      <div class="terms-grid" id="terms"></div>
    </section>

    <section class="panel" id="panel-outline">
      <div id="outlines"></div>
    </section>

    <section class="panel" id="panel-all">
      <div class="list-card" id="all-list"></div>
    </section>
  </main>
</div>

<script src="assets/app.js"></script>
</body>
</html>
